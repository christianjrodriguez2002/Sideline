name: Build Sideline
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the project
        run: mkdir src && unzip -q Sideline.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the APK
        working-directory: src
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Name the APK after the version
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' src/app/build.gradle.kts)
          echo "VERSION=$V" >> $GITHUB_ENV
          cp src/app/build/outputs/apk/release/app-release.apk "Sideline-$V.apk"
          test -f src/RELEASE_NOTES.md || echo "Sideline $V" > src/RELEASE_NOTES.md
      - name: Publish the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: Sideline ${{ env.VERSION }}
          body_path: src/RELEASE_NOTES.md
          files: Sideline-${{ env.VERSION }}.apk
